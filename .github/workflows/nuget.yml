name: Build and publish NuGet package

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nuget-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: 10.0.x
  PACKAGE_PROJECT: src/AssemblyInfo/AssemblyInfo.csproj
  PACKAGE_OUTPUT: artifacts/package

jobs:
  verify:
    name: Build, test, and pack
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run tests
        run: dotnet test AssemblyInfo.slnx --configuration Release

      - name: Pack validation package
        if: github.event_name != 'release' && github.event_name != 'workflow_dispatch'
        run: dotnet pack ${{ env.PACKAGE_PROJECT }} --configuration Release --output ${{ env.PACKAGE_OUTPUT }} --no-restore

      - name: Pack tagged release package
        if: github.event_name == 'release'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Release tag '$RELEASE_TAG' must use the format v1.2.3 or v1.2.3-beta.1." >&2
            exit 1
          fi
          package_version=${RELEASE_TAG#v}
          dotnet pack "${{ env.PACKAGE_PROJECT }}" --configuration Release --output "${{ env.PACKAGE_OUTPUT }}" --no-restore -p:PackageVersion="$package_version"

      - name: Pack integration-test package
        if: github.event_name == 'workflow_dispatch'
        run: dotnet pack ${{ env.PACKAGE_PROJECT }} --configuration Release --output ${{ env.PACKAGE_OUTPUT }} --no-restore -p:PackageVersion=1.0.0-ci.${{ github.run_number }}

      - name: Inspect package contents
        shell: bash
        run: |
          set -euo pipefail
          package=$(find "${{ env.PACKAGE_OUTPUT }}" -maxdepth 1 -name '*.nupkg' ! -name '*.snupkg' -print -quit)
          symbols_package=$(find "${{ env.PACKAGE_OUTPUT }}" -maxdepth 1 -name '*.snupkg' -print -quit)
          unzip -l "$package"
          unzip -l "$package" | grep -q 'README.md'
          unzip -l "$package" | grep -q 'LICENSE'
          unzip -l "$package" | grep -Eq 'analyzers/dotnet/cs/(.*/)?SlusserLabs.AssemblyInfo.dll'
          if unzip -l "$package" | grep -q '\.pdb'; then
            echo 'The main package must not contain PDB files.' >&2
            exit 1
          fi
          unzip -l "$symbols_package" | grep -q 'SlusserLabs.AssemblyInfo.pdb'

      - name: Test package in a clean consumer project
        shell: bash
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/assemblyinfo-package-test/packages
        run: |
          set -euo pipefail
          package=$(find "${{ env.PACKAGE_OUTPUT }}" -maxdepth 1 -name 'SlusserLabs.AssemblyInfo.*.nupkg' ! -name '*.snupkg' -print -quit)
          package_version=${package##*/SlusserLabs.AssemblyInfo.}
          package_version=${package_version%.nupkg}
          dotnet restore tests/AssemblyInfo.PackageTests/AssemblyInfo.PackageTests.csproj --configfile tests/AssemblyInfo.PackageTests/NuGet.config -p:AssemblyInfoPackageVersion="$package_version"
          dotnet run --project tests/AssemblyInfo.PackageTests/AssemblyInfo.PackageTests.csproj --configuration Release --no-restore -p:AssemblyInfoPackageVersion="$package_version"

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          path: ${{ env.PACKAGE_OUTPUT }}
          if-no-files-found: error

  publish-test:
    name: Publish to NuGet integration feed
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v8
        with:
          name: nuget-package
          path: ${{ env.PACKAGE_OUTPUT }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Push package to NuGet integration feed
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_TEST_API_KEY }}
        run: |
          set -euo pipefail
          dotnet nuget push "${{ env.PACKAGE_OUTPUT }}"/*.nupkg --api-key "$NUGET_API_KEY" --source https://apiint.nugettest.org/v3/index.json
          dotnet nuget push "${{ env.PACKAGE_OUTPUT }}"/*.snupkg --api-key "$NUGET_API_KEY" --source https://apiint.nugettest.org/v3/index.json

  publish-nuget:
    name: Publish release package
    if: github.event_name == 'release' && github.event.action == 'published' && vars.NUGET_PUBLISH_ENABLED == 'true'
    needs: verify
    runs-on: ubuntu-latest
    environment: nuget-release
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v8
        with:
          name: nuget-package
          path: ${{ env.PACKAGE_OUTPUT }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Log in to nuget.org with trusted publishing
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push package to nuget.org
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          dotnet nuget push "${{ env.PACKAGE_OUTPUT }}"/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push "${{ env.PACKAGE_OUTPUT }}"/*.snupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Upload packages to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          cd "${{ env.PACKAGE_OUTPUT }}"
          sha256sum *.nupkg *.snupkg > SHA256SUMS
          gh release upload "$RELEASE_TAG" *.nupkg *.snupkg SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
